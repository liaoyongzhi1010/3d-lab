        <div id="content"><div class="loading">正在加载实验记录…</div></div>

  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(location.search);
      const filename = params.get('doc') || 'dpc-main-n100.md';
      const safeFilename = /^[a-z0-9][a-z0-9-]*\.md$/;
      const content = document.getElementById('content');
      const crumb = document.getElementById('crumb');
      const source = document.getElementById('source');

      document.querySelectorAll('[data-doc]').forEach((link) => {
        if (link.dataset.doc === filename) link.classList.add('active');
      });

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]);
      }

      function safeHref(raw) {
        const href = raw.trim();
        if (/^(?:https?:|mailto:|javascript:|data:|\/\/)/i.test(href)) return '#';
        if (href.startsWith('#')) return href;
        if (!/^(?:\.\.\/){0,3}[a-zA-Z0-9_./-]+(?:\?[a-zA-Z0-9_=&.-]*)?(?:#[a-zA-Z0-9_.-]*)?$/.test(href)) return '#';
        return `experiments/${href}`;
      }

      function inlineMarkdown(value) {
        let text = escapeHtml(value);
        const codeTokens = [];
        text = text.replace(/`([^`]+)`/g, (_, code) => {
          const token = `@@CODE${codeTokens.length}@@`;
          codeTokens.push(`<code>${code}</code>`);
          return token;
        });
        text = text.replace(/!\[([^\]]*)\]\(([^\s)]+)(?:\s+"[^"]*")?\)/g, (_, alt, href) => `<img src="${escapeHtml(safeHref(href))}" alt="${alt}">`);
        text = text.replace(/\[([^\]]+)\]\(([^\s)]+)(?:\s+"[^"]*")?\)/g, (_, label, href) => `<a href="${escapeHtml(safeHref(href))}">${label}</a>`);
        text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');
        text = text.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
        text = text.replace(/@@CODE(\d+)@@/g, (_, index) => codeTokens[Number(index)]);
        return text;
      }

      function slugify(value, used) {
        const base = value.replace(/[`*_\[\]()]/g, '').trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') || 'section';
        let slug = base;
        let suffix = 2;
        while (used.has(slug)) slug = `${base}-${suffix++}`;
        used.add(slug);
        return slug;
      }

      function isTableSeparator(line) {
        return /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
      }

      function tableCells(line) {
        return line.trim().replace(/^\||\|$/g, '').split('|').map((cell) => cell.trim());
      }

      function renderMarkdown(markdown) {
        const lines = markdown.replace(/\r\n?/g, '\n').split('\n');
        const html = [];
        const headings = [];
        const usedSlugs = new Set();
        let index = 0;

        while (index < lines.length) {
          const line = lines[index];
          if (!line.trim()) { index++; continue; }

          const fence = line.match(/^\s*```([\w-]*)\s*$/);
          if (fence) {
            const code = [];
            index++;
            while (index < lines.length && !/^\s*```/.test(lines[index])) code.push(lines[index++]);
            if (index < lines.length) index++;
            html.push(`<pre><code${fence[1] ? ` class="language-${escapeHtml(fence[1])}"` : ''}>${escapeHtml(code.join('\n'))}</code></pre>`);
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            const level = heading[1].length;
            const title = heading[2].replace(/\s+#+\s*$/, '');
            const id = slugify(title, usedSlugs);
            html.push(`<h${level} id="${id}">${inlineMarkdown(title)}</h${level}>`);
            if (level > 1) headings.push({ id, title: title.replace(/[*_`]/g, '') });
            index++;
            continue;
          }

          if (index + 1 < lines.length && line.includes('|') && isTableSeparator(lines[index + 1])) {
            const header = tableCells(line);
            index += 2;
            const rows = [];
            while (index < lines.length && lines[index].includes('|') && lines[index].trim()) rows.push(tableCells(lines[index++]));
            html.push(`<div class="table-wrap"><table><thead><tr>${header.map((cell) => `<th>${inlineMarkdown(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${inlineMarkdown(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
            continue;
          }

          if (/^\s*>\s?/.test(line)) {
            const quote = [];
            while (index < lines.length && /^\s*>\s?/.test(lines[index])) quote.push(lines[index++].replace(/^\s*>\s?/, ''));
            html.push(`<blockquote>${inlineMarkdown(quote.join(' '))}</blockquote>`);
            continue;
          }

          const unordered = line.match(/^\s*[-+*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
          if (unordered || ordered) {
            const tag = unordered ? 'ul' : 'ol';
            const pattern = unordered ? /^\s*[-+*]\s+(.+)$/ : /^\s*\d+[.)]\s+(.+)$/;
            const items = [];
            while (index < lines.length) {
              const match = lines[index].match(pattern);
              if (!match) break;
              items.push(`<li>${inlineMarkdown(match[1])}</li>`);
              index++;
            }
            html.push(`<${tag}>${items.join('')}</${tag}>`);
            continue;
          }

          if (/^\s*(?:---+|___+|\*\*\*+)\s*$/.test(line)) {
            html.push('<hr>'); index++; continue;
          }

          const paragraph = [line.trim()];
          index++;
          while (index < lines.length && lines[index].trim() && !/^(?:#{1,3}\s|\s*```|\s*>|\s*[-+*]\s+|\s*\d+[.)]\s+)/.test(lines[index])) {
            if (index + 1 < lines.length && lines[index].includes('|') && isTableSeparator(lines[index + 1])) break;
            paragraph.push(lines[index++].trim());
          }
          html.push(`<p>${inlineMarkdown(paragraph.join(' '))}</p>`);
        }
        return { html: html.join('\n'), headings };
      }

      function showError(message) {
        content.innerHTML = `<div class="error"><strong>无法打开实验记录</strong><br>${escapeHtml(message)}</div>`;
        crumb.textContent = '加载失败';
        document.title = '加载失败 · 实验记录';
      }

      if (!safeFilename.test(filename)) {
        showError('doc 参数必须是仅含小写字母、数字和连字符的 Markdown 文件名。');
        return;
      }

      fetch(`experiments/${filename}`, { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error(`本地文件返回 HTTP ${response.status}`);
          return response.text();
        })
        .then((markdown) => {
          const rendered = renderMarkdown(markdown);
          content.innerHTML = rendered.html;
          const title = content.querySelector('h1')?.textContent || filename;
          crumb.textContent = title;
          source.textContent = `本地文件 · experiments/${filename}`;
          document.title = `${title} · 实验记录`;
          document.getElementById('heading-nav').innerHTML = rendered.headings.map((heading) => `<a href="#${heading.id}">${escapeHtml(heading.title)}</a>`).join('');
        })
        .catch((error) => showError(`${filename}：${error.message}`));
    })();
  </script>
</body>
